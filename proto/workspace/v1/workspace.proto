// Workspace sync data model. A Manifest is a content-addressed
// snapshot of a directory tree: each regular file decomposes into
// an ordered list of chunks, each addressed by its sha256 digest.
// Symlinks and directories carry their own entries so a remote
// peer can reconstruct the full tree without re-walking.
//
// The wire protocol over which manifests + chunks travel is defined
// in WorkspaceService below; the on-disk store layout is owned by
// internal/cas.
syntax = "proto3";

package daft.workspace.v1;

option go_package = "github.com/richiejp/darkaifactory/internal/genpb/workspace/v1;workspacev1";

// EntryKind classifies a manifest FileEntry. We only ever sync
// regular files, directories, and symlinks; sockets, FIFOs, and
// device nodes are rejected up-front by the manifest builder.
enum EntryKind {
  ENTRY_KIND_UNSPECIFIED = 0;
  ENTRY_KIND_FILE = 1;
  ENTRY_KIND_DIR = 2;
  ENTRY_KIND_SYMLINK = 3;
}

// ChunkRef points at one chunk in the content-addressed store.
// `digest` is the lowercase hex sha256 of the chunk's *uncompressed*
// payload — the digest is stable across compression algorithm
// changes so a peer can re-encode chunks without invalidating
// manifests. `size` is the uncompressed length, useful both for
// read-side preallocation and for sanity-checking transfers.
message ChunkRef {
  string digest = 1;
  uint64 size = 2;
}

// FileEntry is one node in the manifest tree. `path` is always
// forward-slash separated and relative to the manifest root, with
// no leading slash and no `..` segments — the builder rejects
// anything else. `mode` carries the Unix permission bits;
// `kind`-specific fields populate as needed.
message FileEntry {
  string path = 1;
  EntryKind kind = 2;
  uint32 mode = 3;
  // For ENTRY_KIND_FILE: ordered list of chunk refs that
  // concatenate (uncompressed) into the file's contents.
  repeated ChunkRef chunks = 4;
  // For ENTRY_KIND_FILE: full uncompressed file size. Redundant
  // with sum(chunks.size) but useful for fast manifest validation.
  uint64 size = 5;
  // For ENTRY_KIND_SYMLINK: target as the kernel returned it
  // (verbatim — relative or absolute, may dangle).
  string symlink_target = 6;
  // Modification time as Unix nanoseconds. Best-effort metadata;
  // the manifest's correctness comes from chunk digests, not this.
  int64 mtime_unix_nano = 7;
}

// Manifest is the top-level snapshot. Entries are sorted by `path`
// so two manifests of the same tree are byte-identical regardless
// of filesystem walk order, which makes them themselves
// content-hashable downstream.
message Manifest {
  // Manifest format version. Bump on incompatible field semantics.
  uint32 version = 1;
  // Sorted entries (lex order on `path`).
  repeated FileEntry entries = 2;
}

// WorkspaceService is the wire transport for manifests + chunks.
// Get* fetch a published snapshot; Put* upload one. The `workspace`
// name on every request is an opaque key — callers that sync a
// specific mount compose it from (workspace, in-VM target) so two
// mounts of the same workspace don't collide (see workspace.SyncKey).
service WorkspaceService {
  // GetManifest returns the manifest for a workspace by name. The
  // server is the source of truth for what's in the workspace.
  rpc GetManifest(GetManifestRequest) returns (GetManifestResponse);
  // GetChunk fetches a single chunk's compressed payload. Server
  // validates the digest before sending so a corrupt store can't
  // silently poison clients.
  rpc GetChunk(GetChunkRequest) returns (GetChunkResponse);
  // PutManifest stages a manifest under the request's workspace key
  // and returns the digests of referenced chunks the server is still
  // missing, so the client uploads only those. The manifest is
  // published (visible to GetManifest) immediately; a subsequent
  // GetChunk for a not-yet-uploaded digest returns CodeNotFound until
  // the matching PutChunk lands.
  rpc PutManifest(PutManifestRequest) returns (PutManifestResponse);
  // PutChunk installs one compressed chunk. The server decompresses
  // and verifies the sha256 of the uncompressed payload against
  // `digest` before storing — a peer can never plant a chunk under a
  // digest it doesn't hash to.
  rpc PutChunk(PutChunkRequest) returns (PutChunkResponse);
  // AcknowledgeManifest is sent only after the client has successfully
  // materialised the exact manifest. Digest + generation prevent a stale pull
  // from adopting newer sandbox writes.
  rpc AcknowledgeManifest(AcknowledgeManifestRequest) returns (AcknowledgeManifestResponse);
  // RejectManifest discards one exact unadopted generation and restores the
  // newest prior client-recoverable generation, if present.
  rpc RejectManifest(RejectManifestRequest) returns (ManifestControlResponse);
  // DeleteManifest releases protection for one exact current generation.
  rpc DeleteManifest(DeleteManifestRequest) returns (ManifestControlResponse);
  // GetStorageStatus returns bounded aggregate CAS accounting and policy.
  rpc GetStorageStatus(GetStorageStatusRequest) returns (GetStorageStatusResponse);
  // PruneStorage plans cleanup. Public callers are intentionally dry-run only;
  // the node's durable worker owns destructive cleanup.
  rpc PruneStorage(PruneStorageRequest) returns (PruneStorageResponse);
  rpc GetWorkspaceDiskStatus(GetWorkspaceDiskStatusRequest) returns (GetWorkspaceDiskStatusResponse);
  rpc UnfreezeWorkspaceDisk(UnfreezeWorkspaceDiskRequest) returns (GetWorkspaceDiskStatusResponse);
  rpc DeleteWorkspaceData(DeleteWorkspaceDataRequest) returns (DeleteWorkspaceDataResponse);
}

message GetManifestRequest {
  string workspace = 1;
}

message GetManifestResponse {
  Manifest manifest = 1;
  string manifest_digest = 2;
  uint64 generation = 3;
}

message GetChunkRequest {
  string digest = 1;
}

message GetChunkResponse {
  // Compressed (zstd) bytes. Client decompresses and verifies the
  // sha256 of the *uncompressed* result against the requested
  // digest — never trust the server's framing.
  bytes compressed = 1;
}

message PutManifestRequest {
  string workspace = 1;
  Manifest manifest = 2;
}

message PutManifestResponse {
  // Digests referenced by the manifest that the server does not yet
  // hold. The client should PutChunk each of these to complete the
  // push; an empty list means the manifest is already fully backed.
  repeated string missing_digests = 1;
  string manifest_digest = 2;
  uint64 generation = 3;
}

message PutChunkRequest {
  string digest = 1;
  // Compressed (zstd) payload, same framing as GetChunkResponse.
  bytes compressed = 2;
}

message PutChunkResponse {}

message AcknowledgeManifestRequest {
  string workspace = 1;
  string manifest_digest = 2;
  uint64 generation = 3;
}

message AcknowledgeManifestResponse {}

message RejectManifestRequest {
  string workspace = 1;
  string manifest_digest = 2;
  uint64 generation = 3;
}

message DeleteManifestRequest {
  string workspace = 1;
  string manifest_digest = 2;
  uint64 generation = 3;
}

message ManifestControlResponse {
  string manifest_digest = 1;
  uint64 generation = 2;
  bool current_manifest_present = 3;
}

message GetStorageStatusRequest {}

message GetStorageStatusResponse {
  uint64 usage_bytes = 1;
  uint64 protected_bytes = 2;
  uint64 recoverable_bytes = 3;
  uint64 queued_bytes = 4;
  uint64 chunk_count = 5;
  uint64 queued_count = 6;
  uint64 hard_bytes = 7;
  uint64 soft_bytes = 8;
  uint64 target_bytes = 9;
  int64 expiry_seconds = 10;
}

message PruneStorageRequest {
  bool dry_run = 1;
  uint32 max_candidates = 2;
}

message PruneCandidate {
  string digest = 1;
  uint64 size = 2;
  double score = 3;
  string disposition = 4;
  int64 last_use_unix = 5;
}

message PruneStorageResponse {
  repeated PruneCandidate candidates = 1;
  uint64 usage_before = 2;
  uint64 usage_after = 3;
  bool truncated = 4;
}

message ManifestExpectation {
  string workspace = 1;
  string manifest_digest = 2;
  uint64 generation = 3;
}

message GetWorkspaceDiskStatusRequest {
  string workspace_uuid = 1;
}

message GetWorkspaceDiskStatusResponse {
  string workspace_uuid = 1;
  uint64 used_bytes = 2;
  uint64 available_bytes = 3;
  uint64 allowance_bytes = 4;
  bool frozen = 5;
  bool running = 6;
  uint64 protected_bytes = 7;
  repeated ManifestExpectation current_manifests = 8;
}

message UnfreezeWorkspaceDiskRequest {
  string workspace_uuid = 1;
  repeated ManifestExpectation expected_manifests = 2;
}

message DeleteWorkspaceDataRequest {
  string workspace_uuid = 1;
  repeated ManifestExpectation expected_manifests = 2;
}

message DeleteWorkspaceDataResponse {}
