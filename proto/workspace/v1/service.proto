// WorkspaceCatalogService is the orchestrator-facing surface that
// clients (`daft workspace …` from the user-host) use to
// incrementally assemble a Workspace. The catalog itself lives in
// internal/workspacecatalog (Slice B1); this service is the wire
// adapter (Slice B2).
//
// Naming: the existing daft.workspace.v1.WorkspaceService is the
// chunk/manifest sync service. The catalog service is named with
// a "Catalog" suffix to keep both addressable.
//
// Slice scope (B2 is split across multiple slices for size):
//
//   B2a (this file): Create, Get, List, AddMount, AddEnv, AddPort,
//   SetImage, SetTarget — the "happy path" RPCs the user-host CLI
//   needs to assemble a workspace.
//
//   B2b: RemoveMount, RemapMount, FlagMount, RemoveEnv, RemovePort.
//   B2c: Validate, Launch, Stop (workspace → SandboxSpec dispatch).
//   B2d: Lock, Unlock, Adopt.
//
// Authorization model: every RPC is authenticated via mTLS peer
// fingerprint (extracted by withPeerMiddleware). For B2a, any
// authenticated caller can mutate any workspace — the per-owner
// lock subsystem that scopes mutation to the holder lands in B2d.
// owner_fingerprint on Workspace is informational and scopes
// name-based handle resolution (your "myapp" can't collide with
// someone else's "myapp").
syntax = "proto3";

package daft.workspace.v1;

import "google/protobuf/duration.proto";
import "sandbox/v1/sandbox.proto";
import "workspace/v1/catalog.proto";

option go_package = "github.com/localai-org/darkaifactory/internal/genpb/workspace/v1;workspacev1";

service WorkspaceCatalogService {
  // Create mints a new Workspace owned by the calling identity.
  // The orchestrator assigns the UUID; the caller supplies the
  // human-readable name (defaults applied client-side from
  // basename($PWD), but server-side requires a non-empty name).
  rpc Create(CreateWorkspaceRequest) returns (WorkspaceResponse) {}

  // Get returns the Workspace addressed by handle. Used by the
  // CLI's `daft workspace status` (which renders the Missing[]
  // list for the user).
  rpc Get(GetWorkspaceRequest) returns (WorkspaceResponse) {}

  // List returns every workspace in the catalog. mine_only=true
  // filters to those owned by the calling identity. List is
  // read-only; persistence (Slice B5) will reuse the same shape.
  rpc List(ListWorkspacesRequest) returns (ListWorkspacesResponse) {}

  // SetImage records an OCI image reference. Replaces any prior
  // image_ref or pending_build_id. Empty image_ref clears the
  // field (reverts to DRAFT if no other image source set).
  rpc SetImage(SetImageRequest) returns (WorkspaceResponse) {}

  // SetDevcontainer records the path to a devcontainer.json within the
  // workspace content. At Launch the orchestrator reads it from the
  // pushed content, projects it to a base spec, and overlays the
  // explicit spec fields on top. Empty clears it.
  rpc SetDevcontainer(SetDevcontainerRequest) returns (WorkspaceResponse) {}

  // SetTarget pins the workspace to a specific sandbox-host by
  // mTLS fingerprint. Empty fingerprint clears the pin (scheduler
  // will pick at Launch time, once Launch lands in B2c).
  rpc SetTarget(SetTargetRequest) returns (WorkspaceResponse) {}

  // SetResources records the guest VM's RAM and vCPU sizing.
  // Zero in either field clears it (reverts to the executor's
  // default). Projected onto the SandboxSpec at Launch.
  rpc SetResources(SetResourcesRequest) returns (WorkspaceResponse) {}

  // SetNestedVirtualization toggles whether the workload may run
  // its own (L2) VMs — when enabled the executor binds /dev/kvm
  // into the container and adds the cgroup device-allow. Off by
  // default (a privilege/attack-surface bump). Projected onto the
  // SandboxSpec at Launch.
  rpc SetNestedVirtualization(SetNestedVirtualizationRequest) returns (WorkspaceResponse) {}

  // SetPrivilegedFuseMounts toggles whether the workload may mount
  // FUSE filesystems — when enabled the executor binds /dev/fuse into
  // the container, adds the cgroup device-allow, and grants
  // CAP_SYS_ADMIN (near-root inside the VM). Off by default (a real
  // privilege/attack-surface bump). Projected onto the SandboxSpec at
  // Launch.
  rpc SetPrivilegedFuseMounts(SetPrivilegedFuseMountsRequest) returns (WorkspaceResponse) {}

  // AddMount appends a Mount to the workspace. Mount.target must
  // be absolute; the orchestrator rejects empty or relative targets
  // and refuses a duplicate target in the existing mount set.
  rpc AddMount(AddMountRequest) returns (WorkspaceResponse) {}

  // AddEnv appends an EnvVar. Empty name is rejected. Duplicate
  // names are rejected (use the future B2b RemoveEnv first).
  rpc AddEnv(AddEnvRequest) returns (WorkspaceResponse) {}

  // AddPort appends a PortMapping. Container port and protocol
  // must be set explicitly; UNSPECIFIED protocol is rejected so
  // the orchestrator's ingress (Phase C) can shape correctly.
  rpc AddPort(AddPortRequest) returns (WorkspaceResponse) {}

  // RemoveMount drops the mount whose target matches the request.
  // Returns NotFound if no mount has that target. Symmetric to
  // AddMount; the per-user-host RemapMount / FlagMount overrides
  // live in WorkspaceAdoptionService (Phase F).
  rpc RemoveMount(RemoveMountRequest) returns (WorkspaceResponse) {}

  // RemoveEnv drops the env var with the given name. Returns
  // NotFound if no env has that name.
  rpc RemoveEnv(RemoveEnvRequest) returns (WorkspaceResponse) {}

  // RemovePort drops the port mapping with the given (port,
  // protocol). Returns NotFound if the pair is not present.
  rpc RemovePort(RemovePortRequest) returns (WorkspaceResponse) {}

  // Validate recomputes the workspace's readiness. DRAFT
  // workspaces with no missing fields auto-promote to READY;
  // READY workspaces whose state has since drifted (e.g. the
  // last mount was removed) auto-demote to DRAFT. Returns the
  // resulting workspace; no transition is treated as an error.
  // RUNNING / FROZEN / STOPPED / ARCHIVED workspaces are left
  // untouched — Validate is the readiness sieve for not-yet-
  // launched workspaces only.
  rpc Validate(ValidateRequest) returns (WorkspaceResponse) {}

  // Launch dispatches the workspace to its pinned sandbox-host.
  // Preconditions: status READY or STOPPED; missing[] empty;
  // target_sandbox_fingerprint set. The orchestrator mints a
  // fresh dispatch_id, composes a SandboxSpec from the workspace,
  // and ships it via the sandbox-control stream. On success the
  // status transitions to RUNNING and current_dispatch_id is
  // populated. FailedPrecondition for state-machine violations
  // and offline sandboxes; Unavailable when the sandbox is
  // momentarily backlogged (the caller may retry).
  rpc Launch(LaunchRequest) returns (WorkspaceResponse) {}

  // Stop transitions a RUNNING or FROZEN workspace to STOPPED
  // and clears current_dispatch_id. For Slice B2c this is
  // catalog-only — the wire teardown signal to the sandbox-host
  // lands in a follow-up sub-slice. STOPPED workspaces stay
  // mutable; a subsequent Launch boots a fresh VM.
  rpc Stop(StopRequest) returns (WorkspaceResponse) {}

  // Acquire takes (or refreshes) the workspace's per-owner write
  // lock. While the lock is held, only the holder can mutate the
  // workspace; every other authenticated caller's mutator
  // returns FailedPrecondition with reason LockHeld. The lock
  // auto-releases after the requested TTL — Acquire is also the
  // refresh primitive (calling Acquire as the current holder
  // extends the expiry).
  //
  // Refusal cases: held by someone else and not yet expired
  // (FailedPrecondition). Refusal for an unknown workspace
  // surfaces as NotFound. Phase F3 adds an explicit `force`
  // override with an audit-log entry; B2d ships only the
  // own-or-unheld semantic.
  rpc Acquire(AcquireRequest) returns (WorkspaceResponse) {}

  // Release clears the workspace's write lock if held by the
  // caller. Calling Release on an unheld workspace is a no-op
  // (idempotent); calling it on a workspace held by someone
  // else returns FailedPrecondition with reason LockHeld.
  rpc Release(ReleaseRequest) returns (WorkspaceResponse) {}

  // ForwardPort is the bidi byte channel a user-host CLI dials
  // to tunnel local TCP traffic into a running workspace's
  // container. The first message MUST be a ForwardFrame{hello}
  // carrying the addressed (workspace, container_port);
  // subsequent messages carry data bytes.
  //
  // The orchestrator resolves the workspace to its bound Node,
  // calls OpenPortBridge to open a labeled stream into the
  // sandboxd, and io.Copy splices the two streams. Errors:
  // NotFound when the handle doesn't resolve; FailedPrecondition
  // when the workspace isn't RUNNING (no current_sandbox);
  // Unavailable when the Node is offline or the stream backlog is
  // full. See PLAN.md Phase C3.
  rpc ForwardPort(stream ForwardFrame) returns (stream ForwardFrame) {}

  // AttachSandbox is the bidi PTY channel a user-host CLI dials
  // to open an interactive shell (or arbitrary exec) inside the
  // running workspace's container. The first frame on the
  // client side MUST be an AttachFrame{hello} carrying the
  // workspace handle, the command to exec, and (if tty=true)
  // the initial window size. The orchestrator resolves the
  // workspace, calls OpenAttachBridge to open a sandboxd-side
  // AttachStream, and splices the two bidi streams. Data frames
  // pass through opaquely; resize frames flow client → sandbox
  // and translate to the in-VM PTY's TIOCSWINSZ.
  //
  // Errors: NotFound when the handle doesn't resolve;
  // FailedPrecondition when the workspace isn't RUNNING (no
  // current_sandbox); Unavailable when the Node is offline.
  // See PLAN.md Slice D2.
  rpc AttachSandbox(stream AttachFrame) returns (stream AttachFrame) {}

  // ObserverTail streams a running workspace's per-sandbox host-side
  // observer log (the newline-delimited JSON Tier-1 trace) back to a
  // user-host CLI — `daft sandbox observer-tail`. The orchestrator
  // resolves the workspace to its current_sandbox, calls
  // OpenObserverBridge to open a sandboxd-side ObserverStream, and
  // relays the log chunks. Read-only: data flows sandbox → client
  // only. When follow is false the current file is sent once and the
  // stream ends; when true the stream stays open and forwards new
  // lines as the observer appends them (tail -f).
  //
  // Errors: NotFound when the handle doesn't resolve;
  // FailedPrecondition when the workspace isn't RUNNING (no
  // current_sandbox); Unavailable when the Node is offline.
  rpc ObserverTail(ObserverTailRequest) returns (stream ObserverChunk) {}

  // ObserveSummary returns the current build-progress summary snapshot
  // for a running workspace's sandbox — the guest-written
  // progress.Summary JSON, surfaced to `daft sandbox observe`. One-shot
  // and unary: the orchestrator resolves the workspace to its
  // current_sandbox, reads the summary file once over the node broker
  // (the same rendezvous as ObserverTail, with the summary source
  // selector), and returns the bytes verbatim. The CLI polls this on an
  // interval for --follow, which is well-defined because the summary
  // file is rewritten atomically.
  //
  // Errors: NotFound when the handle doesn't resolve;
  // FailedPrecondition when the workspace isn't RUNNING (no
  // current_sandbox); Unavailable when the Node is offline.
  rpc ObserveSummary(ObserveSummaryRequest) returns (ObserveSummaryResponse) {}
}

// ObserveSummaryRequest names the workspace whose current sandbox's
// build-progress summary to read. Name resolution is scoped to the
// calling identity's mTLS fingerprint, matching the rest of the catalog.
message ObserveSummaryRequest {
  WorkspaceHandle workspace = 1;
}

// ObserveSummaryResponse carries the progress.Summary JSON document
// verbatim. Empty when the sandbox has not written a summary yet (the
// gadget is still starting, or Tier-2 observe is opted out on the node).
message ObserveSummaryResponse {
  bytes summary = 1;
}

// ObserverTailRequest names the workspace whose current sandbox's
// observer log to stream. Name resolution is scoped to the calling
// identity's mTLS fingerprint, matching the rest of the catalog.
message ObserverTailRequest {
  WorkspaceHandle workspace = 1;
  // Keep the stream open and forward appended lines (tail -f) instead
  // of sending the current file once and closing.
  bool follow = 2;
}

// ObserverChunk carries an opaque slice of the observer log. The
// bytes are forwarded verbatim; the client writes them straight to
// its output. Lines may be split across chunks.
message ObserverChunk {
  bytes data = 1;
}

// ForwardFrame is the wire envelope for the ForwardPort byte
// channel. First frame on each direction MUST be a ForwardHello;
// subsequent frames carry opaque application bytes.
message ForwardFrame {
  oneof body {
    ForwardHello hello = 1;
    bytes data = 2;
  }
}

// ForwardHello identifies which (workspace, container_port) the
// caller wants to bridge to. Workspace name resolution is scoped
// to the calling identity's mTLS fingerprint, matching the rest
// of the catalog's name semantics.
message ForwardHello {
  WorkspaceHandle workspace = 1;
  uint32 container_port = 2;
}

// AttachFrame is the wire envelope for the AttachSandbox bidi
// stream. First frame on the client side MUST be an AttachHello;
// the orchestrator emits a hello-less first frame on the return
// path once the bridge is established (a zero-data frame). All
// subsequent frames are application bytes or window-resize
// control events.
message AttachFrame {
  oneof body {
    AttachHello hello = 1;
    bytes data = 2;
    AttachResize resize = 3;
  }
}

// AttachHello identifies the target workspace and the exec
// shape. The orchestrator routes to the workspace's
// current_sandbox; the in-VM agent runs `command` with a PTY if
// `tty` is true.
message AttachHello {
  WorkspaceHandle workspace = 1;
  // Command to exec inside the container. Empty selects the
  // agent's default shell (/bin/sh -l, or bash if present).
  repeated string command = 2;
  // Allocate a PTY for the exec. Almost always true; false is
  // useful for one-shot commands consuming piped stdin.
  bool tty = 3;
  // Initial window size when tty=true. Both required > 0.
  uint32 cols = 4;
  uint32 rows = 5;
}

// AttachResize is a window-resize control frame. Sent from the
// client whenever its local terminal's window size changes
// (SIGWINCH). Strictly client → orchestrator → sandbox;
// orchestrator never emits one back to the client.
message AttachResize {
  uint32 cols = 1;
  uint32 rows = 2;
}

// WorkspaceHandle addresses a workspace by either its canonical
// UUID or its per-owner name. Name resolution is scoped to the
// calling identity's mTLS fingerprint — addressing a workspace
// owned by a different identity requires the UUID. Adoption
// (Slice F1) adds a way to address by name across owners.
message WorkspaceHandle {
  oneof handle {
    string uuid = 1;
    string name = 2;
  }
}

message CreateWorkspaceRequest {
  // Per-owner human alias (default basename($PWD) on the user
  // -host). Required; empty is rejected.
  string name = 1;
}

message WorkspaceResponse {
  Workspace workspace = 1;
}

message GetWorkspaceRequest {
  WorkspaceHandle handle = 1;
}

message ListWorkspacesRequest {
  // Filter to workspaces owned by the calling identity. Default
  // (false) returns the whole catalog — useful for operator
  // tooling. Per-owner scoping for non-operator clients lands
  // when role gating (post-B-phase) is introduced.
  bool mine_only = 1;
}

message ListWorkspacesResponse {
  repeated Workspace workspaces = 1;
}

message SetImageRequest {
  WorkspaceHandle handle = 1;
  // OCI image reference. Empty clears the field.
  string image_ref = 2;
}

message SetDevcontainerRequest {
  WorkspaceHandle handle = 1;
  // Path to a devcontainer.json within the workspace content (e.g.
  // ".devcontainer/devcontainer.json"). Empty clears it.
  string devcontainer_path = 2;
}

message SetTargetRequest {
  WorkspaceHandle handle = 1;
  // mTLS fingerprint of the pinned sandbox-host. Empty clears
  // the pin.
  string sandbox_fingerprint = 2;
}

message SetResourcesRequest {
  WorkspaceHandle handle = 1;
  // Guest RAM in bytes. Zero clears it (executor default).
  uint64 memory_bytes = 2;
  // Guest vCPU count. Zero clears it (executor default).
  uint32 cpu_cores = 3;
}

message SetNestedVirtualizationRequest {
  WorkspaceHandle handle = 1;
  // true grants the workload nested-virt access; false revokes it.
  bool enable = 2;
}

message SetPrivilegedFuseMountsRequest {
  WorkspaceHandle handle = 1;
  // true grants the workload privileged FUSE mounts (CAP_SYS_ADMIN +
  // /dev/fuse); false revokes it.
  bool enable = 2;
}

message AddMountRequest {
  WorkspaceHandle handle = 1;
  daft.sandbox.v1.Mount mount = 2;
}

message AddEnvRequest {
  WorkspaceHandle handle = 1;
  daft.sandbox.v1.EnvVar env = 2;
}

message AddPortRequest {
  WorkspaceHandle handle = 1;
  daft.sandbox.v1.PortMapping port = 2;
}

message RemoveMountRequest {
  WorkspaceHandle handle = 1;
  // Absolute in-VM target of the mount to drop.
  string target = 2;
}

message RemoveEnvRequest {
  WorkspaceHandle handle = 1;
  // Name of the env var to drop.
  string name = 2;
}

message RemovePortRequest {
  WorkspaceHandle handle = 1;
  // Container port + protocol of the mapping to drop. The pair
  // (not the port alone) is the key because the same container
  // port can be bound on both TCP and UDP.
  uint32 container_port = 2;
  daft.sandbox.v1.Protocol protocol = 3;
}

message ValidateRequest {
  WorkspaceHandle handle = 1;
}

message LaunchRequest {
  WorkspaceHandle handle = 1;
}

message StopRequest {
  WorkspaceHandle handle = 1;
}

message AcquireRequest {
  WorkspaceHandle handle = 1;
  // Lock auto-release window. Required (positive); a zero/empty
  // duration is rejected with InvalidArgument so a runaway
  // never-refreshed client can't leave a workspace permanently
  // locked. Refresh by calling Acquire again with the same handle.
  google.protobuf.Duration ttl = 2;
}

message ReleaseRequest {
  WorkspaceHandle handle = 1;
}
