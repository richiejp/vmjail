// Workspace catalog: orchestrator-side state for the "Workspace as
// a first-class object" model (PLAN.md Phase B).
//
// A Workspace is a persistent, mutable record owned by the
// orchestrator. Clients (`daft workspace …` from the user-host)
// incrementally assemble one by issuing Add/Set/Remove operations;
// at Launch time the orchestrator derives a one-shot SandboxSpec
// (see daft.nodectrl.v1) and dispatches it to a Node.
// The sandbox-host stores nothing across runs — the workspace is
// the source of truth.
//
// This file declares the data shape only. The service surface
// (WorkspaceCatalogService.* RPCs) lands in Slice B2.
syntax = "proto3";

package daft.workspace.v1;

import "google/protobuf/timestamp.proto";
import "nodectrl/v1/nodectrl.proto";

option go_package = "github.com/richiejp/darkaifactory/internal/genpb/workspace/v1;workspacev1";

// WorkspaceStatus is the workspace lifecycle state. The full state
// machine (and the allowed transitions) lands in Slice B4; B1
// reserves the values so the proto doesn't need a wire break later.
enum WorkspaceStatus {
  WORKSPACE_STATUS_UNSPECIFIED = 0;
  // DRAFT: created but `missing[]` is non-empty — at least one
  // required field (image / target / a mount) is still unset.
  WORKSPACE_STATUS_DRAFT = 1;
  // READY: all required fields populated; Launch will accept it.
  WORKSPACE_STATUS_READY = 2;
  // RUNNING: dispatched and currently executing on a sandbox-host.
  WORKSPACE_STATUS_RUNNING = 3;
  // FROZEN: VM is QMP-stopped (policy or disconnect-driven, see
  // Phase G). Resumable via Thaw.
  WORKSPACE_STATUS_FROZEN = 4;
  // STOPPED: not currently running; mutations are allowed and a
  // subsequent Launch will start a fresh VM.
  WORKSPACE_STATUS_STOPPED = 5;
  // ARCHIVED: terminal. Kept for audit; no further launches.
  WORKSPACE_STATUS_ARCHIVED = 6;
}

// Workspace is the orchestrator's record of a single workspace.
//
// Identity:
//   - uuid is the canonical, immutable id (minted at Create time).
//   - (owner_fingerprint, name) is a per-owner human alias enforced
//     unique within the owner's set.
// See PLAN.md "Open questions: Workspace identity across hosts".
//
// Mutability:
//   - uuid, owner_fingerprint, created_at: immutable after Create.
//   - Everything else is mutated incrementally via
//     WorkspaceCatalogService RPCs (Slice B2).
//
// Wire compatibility: fields are added at the tail; never renumbered.
message Workspace {
  // Canonical id (RFC-4122 UUID, hex with dashes). Immutable.
  string uuid = 1;
  // Per-owner human alias (default basename(pwd) on the
  // user-host). Mutable, but must be unique within owner_fingerprint.
  string name = 2;
  // mTLS leaf-cert fingerprint of the user-host that minted the
  // workspace. Adoption by other user-hosts (Slice F1) does not
  // change this — it identifies the original owner.
  string owner_fingerprint = 3;

  // Filesystem mounts visible inside the VM. Reuses the
  // nodectrl.v1 type so the spec→SandboxSpec projection at
  // Launch time is a direct copy.
  repeated daft.nodectrl.v1.Mount mounts = 4;
  // Environment variables for the container's entrypoint.
  repeated daft.nodectrl.v1.EnvVar env = 5;
  // Container ports the workload binds. The orchestrator ingress
  // (Phase C) consumes this list at Launch time.
  repeated daft.nodectrl.v1.PortMapping ports = 6;

  // Image source. Exactly one of image_ref / pending_build_id is
  // set on a READY workspace. Both empty ⇒ DRAFT.
  // OCI image reference (registry/repo:tag or @sha256:...).
  string image_ref = 7;
  // Build identifier issued by the orchestrator when the workspace
  // declared a Dockerfile instead of an image_ref. Resolves to an
  // image_ref once the buildkit-VM (Phase E) finishes.
  string pending_build_id = 8;

  // Optional pinned sandbox-host (mTLS fingerprint). Empty ⇒
  // scheduler picks at Launch time.
  string target_sandbox_fingerprint = 9;
  // GPU reservation. Unset ⇒ CPU-only.
  daft.nodectrl.v1.GpuRequest gpu_request = 10;
  // Sharing policy. UNSPECIFIED ⇒ scheduler-default.
  daft.nodectrl.v1.Isolation isolation = 11;

  // Write-lock owner fingerprint. Empty ⇒ unlocked. Mutations and
  // launches require holding the lock. Phase F3 lands the explicit
  // Acquire / Release RPCs.
  string lock_owner_fingerprint = 12;
  // Wall-clock time at which the lock auto-releases if not refreshed.
  // Only meaningful when lock_owner_fingerprint is set.
  google.protobuf.Timestamp lock_expires_at = 13;

  // Lifecycle state. See WorkspaceStatus.
  WorkspaceStatus status = 14;
  // Human-readable list of required fields still unset on a DRAFT
  // workspace. Clients use it to print "missing: image, target" so
  // the user knows what to add before Launch.
  repeated string missing = 15;

  // Audit timestamps. Immutable / monotonically advancing.
  google.protobuf.Timestamp created_at = 16;
  google.protobuf.Timestamp updated_at = 17;

  // Identifier of the in-flight (or most recent) Dispatch to a
  // sandbox-host. Minted fresh on each Launch; cleared on Stop.
  // Future RPCs (status streaming, log subscribe) will reference
  // this to correlate sandbox-side state back to the workspace.
  string current_dispatch_id = 18;
}
