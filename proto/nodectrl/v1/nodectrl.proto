// NodeControlService is the orchestrator-side control plane for
// `daft-sandboxd serve`. A Node opens a single outbound mTLS
// connection to the orchestrator and:
//
//   1. calls RegisterNode with its capacity advertisement,
//      holding the server-streamed channel open for the lifetime
//      of the sandboxd process. The first event is a SubscriptionReady;
//      subsequent events push Sandbox lifecycle changes down.
//   2. emits Heartbeat unaries on a fixed interval so the
//      orchestrator's registry can mark Nodes dead when the
//      heartbeats stop.
//
// Caller identity for every RPC is the mTLS leaf-cert fingerprint
// surfaced via withPeerMiddleware — there is no node_id field;
// the sandboxd's own identity is the identifier.
//
// See PLAN.md Phase A (registration) and Phase B4 (resource model).
syntax = "proto3";

package daft.nodectrl.v1;

import "google/protobuf/timestamp.proto";
import "sandbox/v1/sandbox.proto";

option go_package = "github.com/richiejp/darkaifactory/internal/genpb/nodectrl/v1;nodectrlv1";

service NodeControlService {
  // RegisterNode advertises a Node's resources and holds the
  // stream open for the orchestrator to push control events
  // (SubscriptionReady plus Sandbox lifecycle events).
  rpc RegisterNode(RegisterNodeRequest) returns (stream NodeEvent) {}

  // Heartbeat refreshes the Node's last-seen timestamp. The Node
  // advertises current resource utilisation alongside the ping so
  // the orchestrator scheduler has a fresh view without a separate
  // RPC. Stateless and idempotent.
  rpc Heartbeat(HeartbeatRequest) returns (HeartbeatResponse) {}

  // ListNodes returns a snapshot of every Node currently
  // registered with the orchestrator. Read-only, intended for
  // operator tooling (`daft node list`) and the scheduler.
  // Snapshot ordering is stable (sorted by fingerprint) for
  // deterministic test output.
  rpc ListNodes(ListNodesRequest) returns (ListNodesResponse) {}

  // OpenPortStream is the byte channel for a single brokered
  // port-forward attach. The Node dials this in response to an
  // OpenPortRequest event delivered on its RegisterNode stream;
  // the orchestrator splices the resulting bidi stream to the
  // caller (typically its C2 HTTP ingress listener).
  //
  // The first message on each direction MUST be a PortStreamHello
  // carrying the announced session_id so the orchestrator can
  // match this stream to its pending request; subsequent messages
  // carry opaque bytes. Inner mTLS is NOT layered on top of this
  // channel — both endpoints are already inside the outer
  // orchestrator-authenticated session and the workload behind
  // the agent's vsock listener is the trust boundary.
  rpc OpenPortStream(stream PortStreamMessage) returns (stream PortStreamMessage) {}

  // AttachStream is the byte channel for a single attach session.
  // The Node dials this in response to an AttachRequest event
  // delivered on its RegisterNode stream; the orchestrator
  // splices the resulting bidi stream to the caller (a
  // `daft workspace attach` client).
  //
  // First message on each direction MUST be an
  // AttachStreamMessage{hello} carrying the announced session_id
  // so the orchestrator can match this stream to its pending
  // request. Subsequent messages carry opaque data bytes or
  // window-resize control frames. The transport is opaque to the
  // orchestrator — the agent inside the VM is the actual PTY
  // endpoint. See PLAN.md Slice D2.
  rpc AttachStream(stream AttachStreamMessage) returns (stream AttachStreamMessage) {}

  // ObserverStream is the byte channel for a single observer-log
  // tail. The Node dials this in response to an ObserverRequest
  // event delivered on its RegisterNode stream; the orchestrator
  // splices the resulting stream to the caller (a `daft sandbox
  // observer-tail` client).
  //
  // First message on each direction MUST be an
  // ObserverStreamMessage{hello} carrying the announced session_id
  // so the orchestrator can match this stream to its pending
  // request. After the Hello, data flows Node → orchestrator only
  // (the log is read-only); the orchestrator's return direction
  // carries nothing and closing it cancels the tail.
  rpc ObserverStream(stream ObserverStreamMessage) returns (stream ObserverStreamMessage) {}

  // ReportJobControl completes one correlated detached-job operation pushed
  // through NodeEvent.job_control. Only the targeted sandbox-host may answer;
  // the orchestrator matches request_id and the authenticated peer before
  // releasing the waiting internal controller.
  rpc ReportJobControl(JobControlResponse) returns (JobControlAck) {}

  // ReportSecretDelivery completes a correlated, one-shot secret operation.
  // It is deliberately separate from detached job control so credential bytes
  // cannot enter job persistence, output, or arbitrary-command surfaces.
  rpc ReportSecretDelivery(SecretDeliveryResponse) returns (SecretDeliveryAck) {}
}

// ProtocolVersion is the wire-protocol version exchanged at
// RegisterNode time. The major component is the wire-compat
// boundary: a peer with a different major MUST be refused. Minor
// and patch are informational for now; once we lock in a long-term
// protocol they will gate optional feature paths.
//
// This is distinct from the build-version string echoed on
// RegisterNodeRequest.version — that one identifies the binary
// for operator triage; this one gates the bytes on the wire.
message ProtocolVersion {
  uint32 major = 1;
  uint32 minor = 2;
  uint32 patch = 3;
}

// HostResources advertises what a Node can dispatch onto. v1
// carries CPU count and physical RAM only; GPU/PCI inventory
// lands in Slice D1.
message HostResources {
  // Logical CPU count (runtime.NumCPU).
  uint32 cpus = 1;
  // Total host RAM in bytes (/proc/meminfo MemTotal × 1024).
  uint64 memory_bytes = 2;
}

message RegisterNodeRequest {
  // Sandboxd build version (matches `daft version`). Lets the
  // orchestrator reject Nodes too old to dispatch onto.
  string version = 1;
  // Host resource advertisement, captured at registration time.
  HostResources resources = 2;
  // Wire-protocol version. Unset (nil) is treated as major=0 and
  // refused — every shipped client sets this field. See
  // ProtocolVersion's doc for the major/minor/patch policy.
  ProtocolVersion protocol_version = 3;
  // OS hostname of the sandbox-host (os.Hostname), for human-friendly
  // node selection (`daft workspace target <hostname>`) and display.
  // Best-effort: empty when the host can't report one. Not an
  // identifier — the fingerprint stays canonical; the hostname is a
  // convenience alias that may collide across hosts.
  string hostname = 4;
  // Random identity for this sandboxd process lifetime. Unlike the certificate
  // fingerprint it changes after every daemon restart, allowing durable
  // AgentRuns to distinguish a reconnect from loss of the Node's in-memory
  // detached-job table.
  string instance_id = 5;
}

// NodeEvent is the envelope for events pushed on the RegisterNode
// stream. K8s-style: one server-stream replays creates / updates
// / deletes via a single watch envelope plus the K8s-shaped
// SubscriptionReady ack on the first event.
message NodeEvent {
  oneof event {
    SubscriptionReady ready = 1;
    SandboxWatchEvent sandbox = 2;
    OpenPortRequest open_port = 3;
    AttachRequest attach = 4;
    ObserverRequest observer = 5;
    JobControlRequest job_control = 6;
    SecretDeliveryRequest secret_delivery = 7;
  }
}

message SecretDeliveryRequest {
  string request_id = 1;
  string sandbox_uid = 2;
  string delivery_id = 3;
  google.protobuf.Timestamp expires_at = 4;
  string provider = 5;
  bytes payload = 6;
}

message SecretDeliveryResponse {
  string request_id = 1;
  string delivery_id = 2;
  bool installed = 3;
  string error = 4;
}

message SecretDeliveryAck {}

// JobControlRequest is an orchestrator-to-Node operation over the existing
// outbound RegisterNode channel. request_id is a short-lived correlation ID;
// it is not the durable job identity. A start's idempotency_key (the AgentRun
// UUID) supplies retry safety when a response is lost.
message JobControlRequest {
  string request_id = 1;
  oneof operation {
    JobStartRequest start = 2;
    JobGetRequest get = 3;
    JobCancelRequest cancel = 4;
    JobDeleteRequest delete = 5;
  }
}

message JobStartRequest {
  string idempotency_key = 1;
  string sandbox_uid = 2;
  repeated string command = 3;
}

message JobGetRequest {
  string job_id = 1;
  uint64 stdout_cursor = 2;
  uint64 stderr_cursor = 3;
  uint32 max_bytes_per_stream = 4;
}

message JobCancelRequest {
  string job_id = 1;
}

// Delete is terminal-only. The orchestrator invokes it only after persisting
// the terminal AgentRun result, releasing bounded Node-side retention.
message JobDeleteRequest {
  string job_id = 1;
}

enum JobState {
  JOB_STATE_UNSPECIFIED = 0;
  JOB_STATE_STARTING = 1;
  JOB_STATE_RUNNING = 2;
  JOB_STATE_CANCELING = 3;
  JOB_STATE_SUCCEEDED = 4;
  JOB_STATE_FAILED = 5;
  JOB_STATE_CANCELED = 6;
}

message JobOutputChunk {
  bytes data = 1;
  uint64 next_cursor = 2;
  bool cursor_expired = 3;
}

message JobSnapshot {
  string job_id = 1;
  string sandbox_uid = 2;
  JobState state = 3;
  JobOutputChunk stdout = 4;
  JobOutputChunk stderr = 5;
  optional int32 exit_code = 6;
  string reason = 7;
  google.protobuf.Timestamp created_at = 8;
  google.protobuf.Timestamp started_at = 9;
  google.protobuf.Timestamp completed_at = 10;
  bool cancel_called = 11;
}

enum JobControlErrorCode {
  JOB_CONTROL_ERROR_CODE_UNSPECIFIED = 0;
  JOB_CONTROL_ERROR_CODE_NOT_FOUND = 1;
  JOB_CONTROL_ERROR_CODE_CAPACITY = 2;
  JOB_CONTROL_ERROR_CODE_INVALID_CURSOR = 3;
  JOB_CONTROL_ERROR_CODE_NOT_TERMINAL = 4;
  JOB_CONTROL_ERROR_CODE_IDEMPOTENCY_CONFLICT = 5;
  JOB_CONTROL_ERROR_CODE_INVALID_ARGUMENT = 6;
  JOB_CONTROL_ERROR_CODE_INTERNAL = 7;
}

message JobControlResponse {
  string request_id = 1;
  JobSnapshot snapshot = 2;
  JobControlErrorCode error_code = 3;
  string error = 4;
}

message JobControlAck {}

// OpenPortRequest asks the Node to dial OpenPortStream for one
// inbound port-forward attach. The Node looks (workspace_uuid,
// container_port) up in its local sandboxgateway Bridger to find
// the running VM's hybrid-vsock UDS, then echoes session_id back
// on the OpenPortStream Hello so the orchestrator can splice.
message OpenPortRequest {
  // Opaque rendezvous token, randomly minted per request. Random
  // 32 bytes, base64-url encoded for readability in logs and
  // traces. Same flavour as workspacebroker.PendingAttach.session_id.
  string session_id = 1;
  // Identifies which Sandbox port to open. The Node uses these as
  // the routing key against its sandboxgateway Bridger.
  string workspace_uuid = 2;
  // Container port the workload is bound to; the Node's
  // PortForward table maps this to the matching VsockPort.
  uint32 container_port = 3;
}

// PortStreamMessage is the OpenPortStream frame. First message
// on each direction is a Hello; the rest carry data bytes.
message PortStreamMessage {
  oneof body {
    PortStreamHello hello = 1;
    bytes data = 2;
  }
}

message PortStreamHello {
  string session_id = 1;
}

// AttachRequest asks the Node to dial AttachStream for one
// inbound attach session. The Node identifies the live sandbox
// by sandbox_uid (matching Sandbox.metadata.uid), dispatches the
// exec to its in-VM daft-agent via vsock, and echoes session_id
// back on the AttachStream Hello so the orchestrator can splice.
message AttachRequest {
  // Opaque rendezvous token (random 32 bytes, base64-url).
  string session_id = 1;
  // Sandbox.metadata.uid of the live sandbox to attach to. The
  // Node uses this as the routing key into its local
  // sandboxgateway AttachBridger.
  string sandbox_uid = 2;
  // Command to exec inside the container. Empty → the agent's
  // default shell.
  repeated string command = 3;
  // Whether to allocate a PTY for the exec. Almost always true;
  // false is useful for one-shot piped commands.
  bool tty = 4;
  // Initial window size when tty=true. Both required > 0.
  uint32 cols = 5;
  uint32 rows = 6;
}

// AttachStreamMessage is the AttachStream frame. First message
// on each direction is a Hello; subsequent frames carry data
// bytes or window-resize control events.
message AttachStreamMessage {
  oneof body {
    AttachStreamHello hello = 1;
    bytes data = 2;
    AttachStreamResize resize = 3;
    AttachStreamExit exit = 4;
  }
}

message AttachStreamHello {
  string session_id = 1;
}

// AttachStreamResize forwards a window-resize event from the
// attaching client through to the in-VM PTY. Strictly
// client → sandbox; the orchestrator passes them transparently.
message AttachStreamResize {
  uint32 cols = 1;
  uint32 rows = 2;
}

// AttachStreamExit preserves the guest command's terminal result across the
// Node relay. A non-empty error means execution failed outside the command;
// otherwise code is the command's authoritative exit status.
message AttachStreamExit {
  int32 code = 1;
  string error = 2;
}

// ObserverSource selects which host-side per-sandbox file an
// ObserverRequest streams. Both ride the same ObserverStream byte
// channel and rendezvous; only the Node's resolver (which registry the
// sandbox_uid is looked up in) differs.
enum ObserverSource {
  // Unset ⇒ the observer log, for back-compat with observer-tail
  // clients minted before this field existed.
  OBSERVER_SOURCE_UNSPECIFIED = 0;
  // The newline-delimited JSON Tier-1 observer log (ObserverRegistry).
  OBSERVER_SOURCE_LOG = 1;
  // The guest-written build-progress summary snapshot
  // (progress.Summary JSON), resolved via the Node's SummaryRegistry.
  OBSERVER_SOURCE_SUMMARY = 2;
}

// ObserverRequest asks the Node to dial ObserverStream for one
// observer-log tail. The Node identifies the live sandbox by
// sandbox_uid (matching Sandbox.metadata.uid), opens that sandbox's
// host-side observer log, and echoes session_id back on the
// ObserverStream Hello so the orchestrator can splice.
message ObserverRequest {
  // Opaque rendezvous token (random 32 bytes, base64-url).
  string session_id = 1;
  // Sandbox.metadata.uid of the live sandbox whose observer log to
  // tail. The Node uses this as the routing key into its local
  // sandboxgateway ObserverRegistry (or SummaryRegistry; see source).
  string sandbox_uid = 2;
  // Keep streaming appended lines (tail -f) rather than sending the
  // current file once and closing.
  bool follow = 3;
  // Which host-side file to stream. Unspecified/LOG ⇒ the observer
  // log; SUMMARY ⇒ the build-progress summary (one-shot, follow
  // ignored). See ObserverSource.
  ObserverSource source = 4;
}

// ObserverStreamMessage is the ObserverStream frame. First message
// on each direction is a Hello; subsequent frames carry opaque
// observer-log bytes (Node → orchestrator only).
message ObserverStreamMessage {
  oneof body {
    ObserverStreamHello hello = 1;
    bytes data = 2;
  }
}

message ObserverStreamHello {
  string session_id = 1;
}

// SandboxWatchEvent reports a Sandbox lifecycle transition the
// Node should react to. The payload is the full Sandbox resource,
// not a delta — the protocol is level-triggered, replay-safe, and
// idempotent.
//
// Event types:
//   ADDED     — a new Sandbox bound to this Node; start it.
//   MODIFIED  — desired state changed (rare in v1 since spec is
//               immutable after Launch; reserved for future
//               status-driven mutations).
//   DELETED   — orchestrator wants this Sandbox torn down.
//   BOOKMARK  — cursor advance without a real change.
message SandboxWatchEvent {
  daft.sandbox.v1.EventType type = 1;
  daft.sandbox.v1.Sandbox sandbox = 2;
}

// SubscriptionReady confirms the registration was recorded.
// Sent once, as the first event on every RegisterNode stream.
// Carries the orchestrator's monotonic accept time so the caller
// can detect a re-register (e.g. after orchestrator restart).
//
// The orchestrator's own ProtocolVersion is echoed here so the
// Node can refuse to serve workloads if the orchestrator is
// running a wire-incompatible build. The handshake is symmetric:
// each side validates the other before any SandboxWatchEvent flows.
message SubscriptionReady {
  google.protobuf.Timestamp accepted_at = 1;
  ProtocolVersion protocol_version = 2;
}

message HeartbeatRequest {
  // Optional updated resource snapshot. Allowed to be nil if the
  // Node has nothing fresh to report.
  HostResources current = 1;
  // Sandboxes the Node currently knows about. Each entry is a
  // {uid, phase} pair. The orchestrator uses this as the
  // reconciliation primitive: a sandbox the orchestrator believes
  // RUNNING that disappears from this list is the level-triggered
  // signal that the workload exited. B4d ships the wire field +
  // minimal reconcile (set Workspace.status.observed_generation
  // and Reconciled when the reported phase matches); the periodic
  // phantom-sweep that turns "missing for N heartbeats" into
  // SandboxLost is B5's reconciler.
  //
  // Reported every heartbeat — the snapshot is authoritative; an
  // empty list explicitly means "no live sandboxes," not "no data".
  repeated LiveSandbox live_sandboxes = 2;
}

// LiveSandbox is one row of the Node's reported sandbox liveness
// set. K8s analogue: the per-pod entries on a kubelet's
// NodeStatus. Carries only what the orchestrator needs to
// reconcile; richer per-sandbox state (conditions, container
// logs, etc.) flows via future RPCs.
message LiveSandbox {
  // The Sandbox.metadata.uid the orchestrator assigned at Launch.
  string uid = 1;
  // PascalCase phase token. Matches daft.sandbox.v1.SandboxStatus.
  // phase: "Pending" | "Running" | "Exited" | "Killed" | "Unknown".
  // Unknown phases pass through to the orchestrator unchanged so
  // a wire-bumped Node can report new states without breaking us.
  string phase = 2;
  // Set once phase is terminal (Exited / Killed).
  int32 exit_code = 3;
}

message HeartbeatResponse {
  // Server-side wall-clock time at which the heartbeat was
  // recorded. Useful for clock-skew debugging in traces.
  google.protobuf.Timestamp seen_at = 1;
}

// ListNodesRequest is empty in v1. A filter / pagination
// surface will land alongside persistence in Slice B6.
message ListNodesRequest {}

// Node mirrors nodectrl.Entry on the wire. Fingerprint is the
// orchestrator's canonical Node id.
message Node {
  // mTLS leaf-cert fingerprint of the sandboxd.
  string fingerprint = 1;
  // Version advertised at RegisterNode time.
  string version = 2;
  // Last reported host capacity (updated on every Heartbeat).
  HostResources resources = 3;
  // When the orchestrator first accepted this registration.
  google.protobuf.Timestamp registered_at = 4;
  // Most recent Heartbeat (or RegisterNode, whichever is later).
  google.protobuf.Timestamp last_seen_at = 5;
  // OS hostname reported at RegisterNode time (may be empty, may
  // collide across hosts). A human-friendly alias for selection /
  // display, not an identifier — the fingerprint is canonical.
  string hostname = 6;
}

message ListNodesResponse {
  repeated Node nodes = 1;
}
