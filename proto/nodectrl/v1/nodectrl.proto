// NodeControlService is the orchestrator-side control plane for
// `daft-sandboxd serve`. A Node opens a single outbound mTLS
// connection to the orchestrator and:
//
//   1. calls RegisterNode with its capacity advertisement,
//      holding the server-streamed channel open for the lifetime
//      of the sandboxd process. The first event is a SubscriptionReady;
//      subsequent events push Sandbox lifecycle changes down.
//   2. emits Heartbeat unaries on a fixed interval so the
//      orchestrator's registry can mark Nodes dead when the
//      heartbeats stop.
//
// Caller identity for every RPC is the mTLS leaf-cert fingerprint
// surfaced via withPeerMiddleware — there is no node_id field;
// the sandboxd's own identity is the identifier.
//
// See PLAN.md Phase A (registration) and Phase B4 (resource model).
syntax = "proto3";

package daft.nodectrl.v1;

import "google/protobuf/timestamp.proto";

option go_package = "github.com/richiejp/darkaifactory/internal/genpb/nodectrl/v1;nodectrlv1";

service NodeControlService {
  // RegisterNode advertises a Node's resources and holds the
  // stream open for the orchestrator to push control events
  // (SubscriptionReady plus Sandbox lifecycle events).
  rpc RegisterNode(RegisterNodeRequest) returns (stream RegisterEvent) {}

  // Heartbeat refreshes the Node's last-seen timestamp. The Node
  // advertises current resource utilisation alongside the ping so
  // the orchestrator scheduler has a fresh view without a separate
  // RPC. Stateless and idempotent.
  rpc Heartbeat(HeartbeatRequest) returns (HeartbeatResponse) {}

  // ListNodes returns a snapshot of every Node currently
  // registered with the orchestrator. Read-only, intended for
  // operator tooling (`daft node list`) and the scheduler.
  // Snapshot ordering is stable (sorted by fingerprint) for
  // deterministic test output.
  rpc ListNodes(ListNodesRequest) returns (ListNodesResponse) {}
}

// ProtocolVersion is the wire-protocol version exchanged at
// RegisterNode time. The major component is the wire-compat
// boundary: a peer with a different major MUST be refused. Minor
// and patch are informational for now; once we lock in a long-term
// protocol they will gate optional feature paths.
//
// This is distinct from the build-version string echoed on
// RegisterNodeRequest.version — that one identifies the binary
// for operator triage; this one gates the bytes on the wire.
message ProtocolVersion {
  uint32 major = 1;
  uint32 minor = 2;
  uint32 patch = 3;
}

// HostResources advertises what a Node can dispatch onto. v1
// carries CPU count and physical RAM only; GPU/PCI inventory
// lands in Slice D1.
message HostResources {
  // Logical CPU count (runtime.NumCPU).
  uint32 cpus = 1;
  // Total host RAM in bytes (/proc/meminfo MemTotal × 1024).
  uint64 memory_bytes = 2;
}

message RegisterNodeRequest {
  // Sandboxd build version (matches `daft version`). Lets the
  // orchestrator reject Nodes too old to dispatch onto.
  string version = 1;
  // Host resource advertisement, captured at registration time.
  HostResources resources = 2;
  // Wire-protocol version. Unset (nil) is treated as major=0 and
  // refused — every shipped client sets this field. See
  // ProtocolVersion's doc for the major/minor/patch policy.
  ProtocolVersion protocol_version = 3;
}

// RegisterEvent is the envelope for events pushed on the
// RegisterNode stream.
message RegisterEvent {
  oneof event {
    SubscriptionReady ready = 1;
    Dispatch dispatch = 2;
  }
}

// Dispatch hands a workload to the registered Node. The
// dispatch_id is opaque to the wire — a future ACK RPC will
// reference it so the orchestrator can correlate completion
// signals back to the originating Dispatch. B4b will replace
// this with a SandboxWatchEvent carrying a full Sandbox resource.
message Dispatch {
  string dispatch_id = 1;
  SandboxSpec spec = 2;
}

// SubscriptionReady confirms the registration was recorded.
// Sent once, as the first event on every RegisterNode stream.
// Carries the orchestrator's monotonic accept time so the caller
// can detect a re-register (e.g. after orchestrator restart).
//
// The orchestrator's own ProtocolVersion is echoed here so the
// Node can refuse to serve workloads if the orchestrator is
// running a wire-incompatible build. The handshake is symmetric:
// each side validates the other before any Dispatch flows.
message SubscriptionReady {
  google.protobuf.Timestamp accepted_at = 1;
  ProtocolVersion protocol_version = 2;
}

message HeartbeatRequest {
  // Optional updated resource snapshot. Allowed to be nil if the
  // Node has nothing fresh to report.
  HostResources current = 1;
}

message HeartbeatResponse {
  // Server-side wall-clock time at which the heartbeat was
  // recorded. Useful for clock-skew debugging in traces.
  google.protobuf.Timestamp seen_at = 1;
}

// ListNodesRequest is empty in v1. A filter / pagination
// surface will land alongside persistence in Slice B6.
message ListNodesRequest {}

// Node mirrors nodectrl.Entry on the wire. Fingerprint is the
// orchestrator's canonical Node id.
message Node {
  // mTLS leaf-cert fingerprint of the sandboxd.
  string fingerprint = 1;
  // Version advertised at RegisterNode time.
  string version = 2;
  // Last reported host capacity (updated on every Heartbeat).
  HostResources resources = 3;
  // When the orchestrator first accepted this registration.
  google.protobuf.Timestamp registered_at = 4;
  // Most recent Heartbeat (or RegisterNode, whichever is later).
  google.protobuf.Timestamp last_seen_at = 5;
}

message ListNodesResponse {
  repeated Node nodes = 1;
}

// SandboxSpec is one dispatchable workload. The orchestrator
// composes a SandboxSpec from a Workspace + scheduler decision and
// hands it to a Node over the RegisterNode stream via Dispatch.
// Slice B4b will promote this to the spec of a first-class Sandbox
// resource.
//
// Wire compatibility: fields are added at the tail; never renumbered.
message SandboxSpec {
  // OCI image reference (registry/repo:tag or @sha256:...).
  // Resolved against the Node's imagestore on dispatch.
  string image_ref = 1;
  // Filesystem mounts visible inside the VM. Order is irrelevant;
  // the executor may sort by target for deterministic mounting.
  repeated Mount mounts = 2;
  // Environment variables seen by the container's entrypoint.
  // No ordering guarantees; duplicate names resolve last-write-wins
  // at the executor (matches Docker / runc behaviour).
  repeated EnvVar env = 3;
  // Container TCP/UDP ports the workload binds. Slice C1 wires
  // these back to the orchestrator's ingress; for A-phase this
  // field is informational.
  repeated PortMapping ports = 4;
  // Optional GPU reservation. Unset (or zero count) ⇒ CPU-only.
  GpuRequest gpu_request = 5;
  // Sharing policy. UNSPECIFIED ⇒ scheduler-default (currently
  // shared-VM with other workspaces owned by the same identity).
  Isolation isolation = 6;
  // Workspace this spec instantiates. The Node's executor uses
  // it to scope filesystem state, port labels, and teardown.
  string workspace_uuid = 7;
}

// Mount is one bind-style mount inside the VM.
message Mount {
  // In-VM mount point, absolute (e.g. "/workspace"). The executor
  // rejects relative or empty targets.
  string target = 1;
  // Logical source identifier. Resolution is Node policy:
  // a workspace UUID maps to the daft-fuse view of that workspace;
  // a registered host-path tag maps to a pre-approved bind source.
  // Free-form host paths are not accepted — adoption (Slice F1)
  // is how user-host directories enter the namespace.
  string source = 2;
  // Mount read-only. Defaults to false (read-write) on the wire.
  bool read_only = 3;
}

// EnvVar is one name=value pair forwarded into the container.
message EnvVar {
  // Variable name. Empty names are rejected by the executor.
  string name = 1;
  // Variable value. Allowed to be empty; the variable is still set.
  string value = 2;
}

// Protocol selects the transport for a PortMapping.
enum Protocol {
  PROTOCOL_UNSPECIFIED = 0;
  PROTOCOL_TCP = 1;
  PROTOCOL_UDP = 2;
}

// PortMapping declares a port the container listens on.
// The reverse direction (host-port allocation) is owned by the
// orchestrator's ingress (Phase C).
message PortMapping {
  // Container listen port. Zero means "any free port"; the
  // ingress reports back the chosen value.
  uint32 container_port = 1;
  // Transport. UNSPECIFIED is rejected — every PortMapping must
  // declare its protocol explicitly so ingress can shape correctly.
  Protocol protocol = 2;
}

// GpuRequest is the GPU reservation attached to a SandboxSpec.
// Wire-level placeholder for Slice D1 (Node GPU advertisement
// + scheduler).
message GpuRequest {
  // Number of logical GPUs required. Zero ⇒ no GPU.
  uint32 count = 1;
  // Minimum VRAM per GPU, in bytes. Zero ⇒ no minimum.
  uint64 min_vram_bytes = 2;
}

// Isolation is the per-workspace sharing policy.
enum Isolation {
  ISOLATION_UNSPECIFIED = 0;
  // SHARED: pack into an existing compatible VM when one is
  // available. Default for CPU-mode workspaces.
  ISOLATION_SHARED = 1;
  // STRICT: dedicate a fresh VM to this workspace. Required for
  // GPU workspaces that don't opt in to sharing (Slice D4).
  ISOLATION_STRICT = 2;
}
