// Wire format for installing one bounded, expiring credential into a guest.
// The host opens a fresh connection per attempt. The response never echoes
// credential bytes.
syntax = "proto3";

package vmjail.agent.v1;

import "google/protobuf/timestamp.proto";

option go_package = "github.com/richiejp/vmjail/internal/genpb/agent/v1;agentv1";

enum SecretKind {
  SECRET_KIND_UNSPECIFIED = 0;
  SECRET_KIND_CODEX_AUTH_JSON = 1;
}

message SecretInstallRequest {
  string delivery_id = 1;
  google.protobuf.Timestamp expires_at = 2;
  SecretKind kind = 3;
  bytes payload = 4;
}

message SecretInstallResponse {
  string delivery_id = 1;
  bool installed = 2;
  string error = 3;
}
