// Wire format for the in-VM daft-agent's per-VM config fetch. Right
// after printing its banner the agent dials the host's config server
// on a fixed AF_VSOCK port (agent.DefaultConfigVsockPort), writes one
// length-prefixed GuestConfigRequest handshake, and reads back one
// length-prefixed GuestConfig response carrying the operational
// settings this VM should apply (shares to mount, container bundle to
// run, …). The server then closes — it's a single request→response.
//
// This replaces hand-serializing those settings as `daft.*` tokens on
// the kernel cmdline, which is world-readable and un-namespaceable (a
// nested container reads the *outer* VM's line). The per-VM identity is
// implicit in the hybrid-vsock socket the connection arrives on, so the
// request carries no identity — only the agent version for
// forward-compatibility.
//
// Framing is the same 4-byte big-endian length prefix the trace stream
// and attach channel use — see internal/trace/stream.go for the
// precedent. Inner mTLS is NOT layered on top: vsock dials are pinned
// to a single VM by the hypervisor; the agent process inside is the
// trust boundary.
syntax = "proto3";

package daft.agent.v1;

option go_package = "github.com/richiejp/darkaifactory/internal/genpb/agent/v1;agentv1";

// GuestConfigRequest is the handshake the agent sends on a fresh
// config connection. Identity is implicit in the per-VM socket, so the
// only field is the agent's version string — the server may use it to
// decide which config schema variant to send as the protocol evolves.
message GuestConfigRequest {
  string agent_version = 1;
}

// GuestConfig is the host's response: the per-VM operational settings
// the agent applies. Slice 1 carries the container bundle + virtio-fs
// shares (the coupled minimum to start a workload — a bundle path lives
// on a share mount); later slices fold in overlays, port-forwards,
// observe-gadget paths, and the trace port, after which the kernel
// cmdline drops to zero daft.* tokens.
message GuestConfig {
  // Absolute guest path of the OCI bundle to crun-run. Empty means "no
  // container" (the bare-boot / share-only path). Mirrors the old
  // daft.bundle= token.
  string bundle = 1;

  // Virtio-fs shares to mount, in order. Mirrors the repeatable
  // daft.share=<tag>:<mountpoint> tokens.
  repeated Share shares = 2;

  // Share is one virtio-fs mount: device tag → absolute guest
  // mountpoint.
  message Share {
    string tag = 1;
    string mountpoint = 2;
    // overlay, when true, wraps the share in a tmpfs-backed overlay so
    // the guest's writes don't reach the host backing dir. Mirrors the
    // old daft.workspace_overlay=<mountpoint> token (which keyed the
    // overlay to a share by its mountpoint); carrying it on the Share
    // itself drops that indirection.
    bool overlay = 3;
  }

  // Guest-side ports the agent vsock-forwards to the container. Mirrors
  // the repeatable daft.port=<vsockPort>:<containerPort> tokens. This is
  // the one genuinely per-workspace table (it comes straight from the
  // SandboxSpec's exposed ports), so it must travel in the payload.
  repeated PortForward port_forwards = 3;

  // PortForward maps an AF_VSOCK port the agent listens on to the TCP
  // port the container is bound to on loopback inside the VM.
  message PortForward {
    uint32 vsock_port = 1;
    uint32 container_port = 2;
  }

  // observe carries the Tier-2 gadget output paths. Absent (nil) leaves
  // every gadget off. Mirrors the daft.observe.* tokens.
  Observe observe = 4;

  // Protocol-feature toggles. The host enables a feature; the agent brings
  // it up on that feature's fixed AF_VSOCK port — a protocol constant (see
  // agent.DefaultAttachVsockPort / DefaultJobVsockPort / DefaultNetVsockPort /
  // DefaultTraceVsockPort), so the port number never travels as per-VM
  // data. These replace the daft.attach_port / daft.net_port /
  // daft.vsock.trace_port cmdline tokens (each of which only ever carried
  // the constant anyway).
  bool attach_enabled = 5; // run interactive attach + detached job listeners
  bool net_enabled = 6;    // dial sandboxd's netstack + bring up tap0
  bool trace_enabled = 7;  // ship the span buffer to the host trace sink

  // Lifecycle commands the agent runs INSIDE the container after it has
  // started, in order. This is the devcontainer postStartCommand
  // (resolved node-side at dispatch — see internal/devcontainer). Each
  // entry is an argv; a shell-form hook is normalised host-side to
  // ["/bin/sh","-c",<shell>]. Empty leaves the agent's post-start step a
  // no-op. A non-zero exit is logged, not fatal — the container keeps
  // running (devcontainer semantics).
  repeated PostStartCommand post_start_commands = 8;

  // Non-secret provider selector. The guest creates the corresponding fixed
  // tmpfs-backed home before the container starts and enables the dedicated
  // secret listener. Empty disables all credential plumbing.
  string credential_provider = 9;

  // PostStartCommand is one resolved lifecycle command: a full argv the
  // agent crun-execs in the running container.
  message PostStartCommand {
    repeated string argv = 1;
  }

  // Observe is the set of in-guest absolute paths the Tier-2 gadgets
  // write to (usually on a writable virtiofs share the host reads back).
  // An empty field leaves that gadget off, matching the old per-token
  // "absent ⇒ disabled" contract.
  message Observe {
    string opensnoop = 1;
    string execsnoop = 2;
    string sleepsnoop = 3;
    string iosnoop = 4;
    string syscalls = 5;
    string summary = 6;
  }
}

// AgentEvent is a status milestone the agent streams to the host over
// the same control connection, after it has received its GuestConfig.
// The host (and the one-shot Hello harness / integration tests) wait
// for these instead of scanning the console banner — VM status belongs
// on the protocol, not the serial console. The agent may send several
// events on the one connection; the host reads framed AgentEvents until
// the agent closes the conn (VM teardown).
message AgentEvent {
  Kind kind = 1;

  // Kind enumerates the milestones. New kinds append; KIND_UNSPECIFIED
  // (the zero value) is never sent by a correct agent and lets the host
  // distinguish "no event" from a real one.
  enum Kind {
    KIND_UNSPECIFIED = 0;
    // BOOT_COMPLETE: the agent finished its boot sequence — shares
    // mounted, container (if any) launched and, for a short-lived
    // workload, run to completion. The Hello harness returns on this.
    BOOT_COMPLETE = 1;
  }
}
