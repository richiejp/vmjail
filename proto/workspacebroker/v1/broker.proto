// Workspace-broker wire protocol. The orchestrator pairs a
// `daft workspace serve` running on a user-host with a
// `daft-sandboxd` waiting to consume a workspace, mints a session,
// and relays the spliced byte channel between them. mTLS runs
// end-to-end between client and sandbox inside the relay — the
// orchestrator authenticates both peers but never sees plaintext
// workspace bytes.
//
// See PLAN.md "Slice 3.5 design" for the architectural rationale.
syntax = "proto3";

package daft.workspacebroker.v1;

option go_package = "github.com/richiejp/darkaifactory/internal/genpb/workspacebroker/v1;workspacebrokerv1";

// BrokerService is the orchestrator-side broker. Both client
// (user-host) and sandbox-host hold persistent outbound streams
// to it; RequestAttach pairs them on demand. Identity is
// established by the outer mTLS connection — every RPC's caller
// is authenticated against the orchestrator's PeerStore.
service BrokerService {
  // RegisterServe is called by a `daft workspace serve` on the
  // user-host. The caller declares which workspace name(s) it can
  // serve; the orchestrator keeps the stream open and pushes one
  // RegistrationEvent each time the subscription state changes
  // (an initial Ready event, then PendingAttach events as attach
  // requests arrive). Caller identity is the outer-mTLS leaf
  // cert; the workspace is scoped to that identity.
  //
  // The Ready event exists so the client knows the subscription
  // is in place on the server — Connect-RPC over HTTP/2 doesn't
  // flush response headers until the first message is sent, so
  // without an initial Ready the client's stream-open call would
  // race the actual server-side registration.
  rpc RegisterServe(RegisterServeRequest) returns (stream RegistrationEvent) {}

  // RegisterSandbox is the sandbox-host's persistent control
  // channel. Returns the same RegistrationEvent stream as
  // RegisterServe, with Ready first then PendingAttach events.
  rpc RegisterSandbox(RegisterSandboxRequest) returns (stream RegistrationEvent) {}

  // RequestAttach is called by `daft workspace attach` (client
  // side) to broker a session. The orchestrator validates that
  // both peers are registered, mints a session_id, pushes a
  // PendingAttach to the sandbox via its open RegisterSandbox
  // stream, and returns the relay endpoint plus session_id to the
  // caller. Both peers then dial Relay with the session_id to
  // open the byte channel (Slice 3.5b).
  rpc RequestAttach(RequestAttachRequest) returns (RequestAttachResponse) {}

  // Relay carries the spliced byte stream. The first message on
  // each direction is a RelayHello carrying session_id; the
  // orchestrator matches the two halves and splices them.
  // Subsequent messages carry opaque bytes — inner mTLS runs
  // end-to-end between client and sandbox-host, so the
  // orchestrator never sees workspace plaintext.
  rpc Relay(stream RelayMessage) returns (stream RelayMessage) {}
}

message RegisterServeRequest {
  // Workspace name the caller can serve. Scoped to the caller's
  // identity (the leaf-cert SPKI fingerprint from mTLS) — the
  // same name from a different identity is a different workspace.
  string workspace = 1;
}

message RegisterSandboxRequest {
  // Sandbox identifier. Opaque to the broker; the only constraint
  // is that the user-host's RequestAttach uses the same value.
  string sandbox_id = 1;
}

message RequestAttachRequest {
  // The serving peer's identity fingerprint. The user-host
  // discovers this out-of-band (e.g. from `daft auth list` or
  // a config file) — same model as the existing TOFU trust
  // pairing.
  string serve_fingerprint = 1;
  // Workspace name registered under serve_fingerprint.
  string workspace = 2;
  // Sandbox identifier the workspace should attach to.
  string sandbox_id = 3;
}

message RequestAttachResponse {
  // Opaque token. Both peers present it on their Relay streams
  // so the orchestrator can splice them. Random 32 bytes,
  // base64-url encoded for readability in logs/traces.
  string session_id = 1;
  // The orchestrator's Relay endpoint, of the form
  // "host:port". For v1 this is always the orchestrator's
  // existing mTLS listener; field is here so we can introduce
  // dedicated relay nodes later without a wire break.
  string relay_endpoint = 2;
}

// RegistrationEvent is the envelope for events pushed on
// RegisterServe/RegisterSandbox streams. The first event is
// always a Ready (subscription confirmed); subsequent events
// are PendingAttach as attach requests arrive.
message RegistrationEvent {
  oneof event {
    SubscriptionReady ready = 1;
    PendingAttach attach = 2;
  }
}

// SubscriptionReady confirms the subscription is in place on
// the orchestrator. Sent once, as the first event on every
// Register* stream. Lets clients reliably observe "registered"
// before issuing dependent operations like RequestAttach.
message SubscriptionReady {}

// PendingAttach is pushed on RegisterServe/RegisterSandbox
// streams when the broker has matched a workspace attach.
message PendingAttach {
  string session_id = 1;
  // Fingerprint of the peer this session will be spliced with —
  // the *other* side of the relay. Lets the receiver validate
  // the inner mTLS handshake matches the expected peer.
  string peer_fingerprint = 2;
  // For RegisterServe receivers: which workspace this attach is
  // for (a single serve stream can have multiple workspaces in
  // flight in principle, though v1 registers one at a time).
  string workspace = 3;
  // For RegisterSandbox receivers: which sandbox this attach is
  // for (likewise).
  string sandbox_id = 4;
}

// RelayMessage is the byte-channel frame. The first message on
// each Relay stream must be a Hello carrying session_id; all
// subsequent messages carry Data.
message RelayMessage {
  oneof body {
    RelayHello hello = 1;
    bytes data = 2;
  }
}

message RelayHello {
  string session_id = 1;
}
