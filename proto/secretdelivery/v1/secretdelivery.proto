// SecretDeliveryService is the trusted, one-shot credential handoff used
// after an AgentRun Sandbox has booted and before its detached process starts.
// Payload bytes are never persisted and never returned by the service.
syntax = "proto3";

package daft.secretdelivery.v1;

import "google/protobuf/timestamp.proto";

option go_package = "github.com/richiejp/darkaifactory/internal/genpb/secretdelivery/v1;secretdeliveryv1";

service SecretDeliveryService {
  rpc Deliver(DeliverSecretRequest) returns (DeliverSecretResponse) {}
}

enum SecretKind {
  SECRET_KIND_UNSPECIFIED = 0;
  SECRET_KIND_CODEX_AUTH_JSON = 1;
}

message DeliverSecretRequest {
  string agent_run_uuid = 1;
  string delivery_id = 2;
  google.protobuf.Timestamp expires_at = 3;
  SecretKind kind = 4;
  bytes payload = 5;
}

message DeliverSecretResponse {
  string agent_run_uuid = 1;
  string delivery_id = 2;
  bool installed = 3;
}
