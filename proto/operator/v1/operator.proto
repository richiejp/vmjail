// OperatorService is the privileged fleet-management boundary. Its callers
// are authorized from the orchestrator's pinned peer store; certificate names
// and request fields never select the caller's role.
syntax = "proto3";

package daft.operator.v1;

import "google/protobuf/timestamp.proto";
import "nodectrl/v1/nodectrl.proto";

option go_package = "github.com/richiejp/darkaifactory/internal/genpb/operator/v1;operatorv1";

service OperatorService {
  rpc AuthorizeNode(AuthorizeNodeRequest) returns (NodeStatus) {}
  rpc RevokeNode(RevokeNodeRequest) returns (NodeStatus) {}
  rpc GetNode(GetNodeRequest) returns (NodeStatus) {}
  rpc ListNodes(ListNodesRequest) returns (ListNodesResponse) {}
}

message AuthorizeNodeRequest {
  string fingerprint = 1;
  string label = 2;
}

message RevokeNodeRequest { string fingerprint = 1; }
message GetNodeRequest { string fingerprint = 1; }

message ListNodesRequest {
  uint32 page_size = 1;
  string page_token = 2;
}

message ListNodesResponse {
  repeated NodeStatus nodes = 1;
  string next_page_token = 2;
}

message NodeStatus {
  string fingerprint = 1;
  string label = 2;
  bool authorized = 3;
  google.protobuf.Timestamp approved_at = 4;
  bool connected = 5;
  string hostname = 6;
  string version = 7;
  daft.nodectrl.v1.HostResources resources = 8;
  google.protobuf.Timestamp registered_at = 9;
  google.protobuf.Timestamp last_seen_at = 10;
}
