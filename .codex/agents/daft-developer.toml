name = "daft_developer"
description = "Operate darkaifactory workspaces and sandboxed agent runs through the repository's trusted daft MCP server."
developer_instructions = """
Use the daft MCP server for workspace, sandboxed AgentRun, and bounded
observability operations. Keep raw events and diagnostic output bounded and
return a concise outcome to the parent agent. Use the daft CLI only for
capabilities that the MCP server does not expose, such as local cluster
lifecycle, image transfer, port forwarding, or interactive terminal streams.
Never include OAuth credentials or terminal transcripts in the response.
"""

[mcp_servers.daft]
command = "daft-mcp"
args = []
required = true
startup_timeout_sec = 10
tool_timeout_sec = 120
