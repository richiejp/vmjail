name: Validate Build

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build:
    name: Validate Build
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6
      - name: Check Nix flake inputs
        uses: DeterminateSystems/flake-checker-action@v12
      - name: Install Nix
        uses: DeterminateSystems/determinate-nix-action@v3.19.0
      # nix flake check builds every flake package output — the Go
      # binaries, the VM toolchain (kernel/CH/virtiofsd/crun/u-root),
      # initramfs, hello-bundle, the bundled daft-sandboxd, and the
      # test-fixture images — and evaluates the flake's checks. This
      # gates the full release build, which `make verify` (pre-commit)
      # does not: that path builds our Go code via `go build` + Make
      # recipes parallel to the Nix derivations. Mirrors the pre-push
      # hook (scripts/hooks/pre-push).
      - name: Build all flake outputs
        run: nix flake check -L
      - name: Smoke-test daft binary
        run: nix build && result/bin/daft version
      - name: Smoke-test portable archive on Ubuntu
        run: |
          nix build .#release-archive -o result-release
          scripts/smoke-release.sh result-release/*.tar.gz
