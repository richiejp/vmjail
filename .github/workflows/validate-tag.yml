name: Validate Tag

on:
  push:
    tags:
      - '*'

jobs:
  build:
    name: Validate Tag
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - name: Check Nix flake inputs
        uses: DeterminateSystems/flake-checker-action@v12
      - name: Install Nix
        uses: DeterminateSystems/determinate-nix-action@v3.19.0
      - name: Build default package
        run: nix build
      - name: Run version
        run: result/bin/vmjail-sandboxd version
      - name: Check tag against vmjail version
        run: |
          TAG_NAME=${GITHUB_REF#refs/tags/}
          VERSION=$(./result/bin/vmjail-sandboxd version | tr -d '[:space:]')
          if [ "$TAG_NAME" != "$VERSION" ]; then
            echo "Error: Tag '$TAG_NAME' does not match vmjail version output '$VERSION'"
            exit 1
          fi
      - name: Build and smoke-test portable archive
        run: |
          nix build .#release-archive -o result-release
          scripts/smoke-release.sh result-release/*.tar.gz
      - name: Publish portable archive and checksum
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG_NAME=${GITHUB_REF#refs/tags/}
          gh release create "$TAG_NAME" result-release/*.tar.gz result-release/*.sha256 \
            --repo "$GITHUB_REPOSITORY" --title "$TAG_NAME" \
            --generate-notes --verify-tag
