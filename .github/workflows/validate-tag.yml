name: Validate Tag

on:
  push:
    tags:
      - '*'

jobs:
  build:
    name: Validate Tag
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6
      - name: Check Nix flake inputs
        uses: DeterminateSystems/flake-checker-action@v12
      - name: Install Nix
        uses: DeterminateSystems/determinate-nix-action@v3.19.0
      - name: Build default package
        run: nix build
      - name: Run version
        run: result/bin/daft version
      - name: Check tag against daft version
        run: |
          TAG_NAME=${GITHUB_REF#refs/tags/}
          VERSION=$(./result/bin/daft version | tr -d '[:space:]')
          if [ "$TAG_NAME" != "$VERSION" ]; then
            echo "Error: Tag '$TAG_NAME' does not match daft version output '$VERSION'"
            exit 1
          fi
