name: Go

on:
  pull_request:
  push:
    branches: [main]

jobs:
  go:
    name: fmt / lint / test / coverage
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6
      - name: Install Nix
        uses: DeterminateSystems/determinate-nix-action@v3.19.0
      # Hosted runners can cover different OS/capability error paths from a
      # developer machine. Keep CI at a stable 94% total floor while local
      # verification continues to ratchet against coverage.txt.
      - name: make all
        run: nix develop --command make all
        env:
          TOTAL_COVERAGE_MIN: "94.0"
