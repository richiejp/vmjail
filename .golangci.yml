version: "2"

# Linter selection is intentionally strict. Adding linters here is
# encouraged; removing them requires justification per
# CONTRIBUTING.md "Verification monotonically increases" — the
# static-analysis surface is treated the same way as the test
# coverage baseline.

linters:
  enable:
    # Built-in / always-on hygiene:
    - govet
    - staticcheck
    - ineffassign
    - unused

    # Project-specific complexity ceilings:
    - gocyclo
    - gocognit
    - funlen
    - maintidx
    - dupl
    - goconst

    # The Go-doesn't-enforce-this-for-you set:
    # See CONTRIBUTING.md "Go doesn't enforce this for you" —
    # these compensate for the language's permissive defaults.
    - errcheck       # every error return is handled
    - errorlint      # %w not %v for error wrapping
    - nilerr         # return non-nil err after checking nil
    - nilnil         # don't return (nil, nil)
    - bodyclose      # close HTTP response bodies
    - contextcheck   # propagate context.Context, don't drop it
    - rowserrcheck   # check sql.Rows.Err
    - sqlclosecheck  # close sql.Rows / sql.Stmt
    - gosec          # security-focused checks
    - gocritic       # large bag of diagnostics
    - copyloopvar    # loop var capture
    - prealloc       # slice preallocation in loops
    - dupword        # accidental "the the"
    - misspell       # misspellings in comments + strings

    # Power of 10 (Go) — keyword/pattern bans (Slice 2). See
    # CONTRIBUTING.md "Power of 10 (Go)". Custom analyzers
    # (nogoto / nolinkname / nodoubleptr) ship in cmd/daft-lint
    # alongside these.
    - forbidigo          # ban panic(/recover(/unsafe.*; allowlist via //nolint
    - gochecknoglobals   # no package-level mutable var; sentinels auto-exempt

  settings:
    gocyclo:
      min-complexity: 100
    gocognit:
      min-complexity: 150
    dupl:
      threshold: 100
    funlen:
      lines: 80
      statements: 50
    maintidx:
      under: 20
    goconst:
      min-len: 3
      min-occurrences: 3
    errcheck:
      # Discard with `_ =` is allowed only with a nearby comment;
      # errcheck doesn't enforce the comment but does enforce that
      # callers can't silently drop errors with a bare call.
      check-type-assertions: true
      check-blank: false
    gosec:
      # Some gosec rules are noisy or context-dependent. The set
      # below is what bites in this codebase. Add to the exclude
      # list only with a one-line justification.
      excludes:
        # G104 is errcheck under a different name; we already enable
        # errcheck, so skip the gosec dup.
        - G104
        # G306 (file perms 0644 not strict enough) — config.json
        # and meta.json are intentionally world-readable.
        - G306
    forbidigo:
      # Each pattern bans a token. Legitimate uses surface at the
      # call site with a //nolint:forbidigo comment explaining why
      # — see CONTRIBUTING.md "Power of 10 (Go)" rules 1b/1c/1d.
      # Patterns are unanchored regex against the identifier text;
      # the leading `^` + trailing `$` keeps them from matching
      # substrings like "panicNotReally".
      forbid:
        - pattern: '^panic$'
          msg: "use internal/assert.True/NoErr (Power of 10 rule 1b); add //nolint:forbidigo with reason if this is the assert vocabulary itself"
        - pattern: '^recover$'
          msg: "recover() is forbidden except at goroutine/handler boundaries (Power of 10 rule 1c); document with //nolint:forbidigo + reason"
        - pattern: '^unsafe\.'
          msg: "unsafe.* is forbidden by Power of 10 rule 1d"
      analyze-types: true
    gocritic:
      # gocritic's "experimental" diagnostics include some that
      # over-flag patterns Go code commonly uses. Pin to the stable
      # tag set + a couple of opinionated extras.
      enabled-tags:
        - diagnostic
        - performance
        - style
      disabled-checks:
        # ifElseChain over a switch is a stylistic preference; we
        # use both depending on the local readability.
        - ifElseChain
        # whyNoLint requires a justification on every nolint
        # directive; that's what reviewers enforce by hand —
        # auto-flagging it on every nolint line is too noisy.
        - whyNoLint
        # hugeParam fires at 80 bytes which is below the size of
        # our Config and BundleOptions structs. Passing those by
        # value is the intentional immutability contract for
        # interface methods like runner.run / shareSidecar.start;
        # converting to pointers would lose that. Disable wholesale
        # rather than annotating every interface method.
        - hugeParam

  exclusions:
    # Path-scoped exclusions for patterns we deliberately allow in
    # specific tree locations. Per-line //nolint suppressions handle
    # the one-off cases; these patterns are systemic and the
    # alternative is hundreds of identical nolint comments.
    rules:
      # Test fixtures, probe analyzers, panic/recover round-trip
      # helpers — all legitimate test concerns that the production
      # rules don't apply to.
      - path: _test\.go
        linters:
          - forbidigo
          - gochecknoglobals
      # cmd/<name>/main.go follows the project's "testable main"
      # pattern: package vars like osExit, stdout, fsRead are
      # indirection points the in-package test swaps, not shared
      # mutable state. See cmd/daft/main.go for the canonical form.
      - path: cmd/.+/main\.go
        linters:
          - gochecknoglobals
      # go/analysis analyzers expose their Analyzer entry point as a
      # package var by API contract — every linter built on x/tools
      # does this. Per-file nolint on every such file is just noise.
      - path: internal/lint/analyzers/.+\.go
        linters:
          - gochecknoglobals
